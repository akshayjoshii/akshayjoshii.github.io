services:
  analytics:
    build: .
    container_name: akjo-analytics
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /app/data
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://akjo.tech,https://www.akjo.tech}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-8192}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - akjo-analytics-data:/app/data
    read_only: true
    tmpfs:
      - /tmp

volumes:
  akjo-analytics-data:
